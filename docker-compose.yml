services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_MONGODB_URI: mongodb://mongo:27017/quotes
      SPRING_MONGODB_DATABASE: quotes
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
